name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure, build, and test
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\dev.ps1
          -Action check
          -Configuration Release
